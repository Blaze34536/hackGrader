[project]
name = "hackgrader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Implycitt", email = "qgbordelon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "gputil==1.4.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "ollama==0.6.2",
    "outcome==1.3.0.post0",
    "packaging==26.3",
    "psutil==7.2.2",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pysocks==1.7.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "selenium==4.46.0",
    "setuptools==84.0.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "trio==0.33.0",
    "trio-websocket==0.12.2",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "webdriver-manager==4.1.2",
    "websocket-client==1.9.0",
    "wsproto==1.3.2",
]

[project.scripts]
hackgrader = "hackgrader:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]