[project]
name = "qwen-ai-detector"
version = "0.1.0"
license = "MIT"
authors = [{ name = "Quentin Bordelon" }]
requires-python = "==3.12.*"
dependencies = [
    "torch",
    "torchvision",
    "trl<=0.11.0",
    "datasets",
    "pandas",
    "rich>=15.0.0",
    "hf-transfer>=0.1.9",
    "transformers>=4.56.2",
    "unsloth>=2025.10.8",
    "gguf>=0.19.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "mistral-common>=1.11.7",
    "conversion>=0.0.9",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["ruff>=0.16.9,<0.17", "pytest>=9.1.1"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
override-dependencies = [
    "xformers; sys_platform == 'never'"
]

[tool.ruff]
line-length = 88
target-version = "py312"
per-file-target-version = { "src/**/*.py" = "py312", "../src/**/*.py" = "py314" }
src = ["src", "../src"]
extend-exclude = ["llama.cpp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "BLE", "SIM", "D", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
known-first-party = [
    "contracts",
    "data",
    "detection",
    "learning",
    "repositories",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
