[project]
name = "qwen-ai-detector"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch",
    "torchvision",
    "trl<=0.11.0",
    "datasets",
    "pandas",
    "rich>=15.0.0",
    "hf-transfer>=0.1.9",
    "transformers>=4.56.2",
    "unsloth>=2025.10.8",
    "gguf>=0.19.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "mistral-common>=1.11.7",
    "conversion>=0.0.9",
    "tiktoken>=0.14.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
override-dependencies = [
    "xformers; sys_platform == 'never'"
]
